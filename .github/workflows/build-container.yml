name: Build borealos container images
on:
  workflow_call:
    inputs:
      images:
        description: Image names to build
        type: string
        default: '["borealos", "borealos-nvidia-open"]'
      source_tag:
        type: string
        default: stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/hal7df

jobs:
  build-image:
    name: Build ${{ matrix.image }}:${{ inputs.source_tag }}
    runs-on: ubuntu-26.04
    continue-on-error: false
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(inputs.images) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 #v10

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Lint Justfile
        shell: bash
        run: just lint

      - name: Build and rechunk container image
        shell: bash
        id: build
        run: |
          just build ${{ matrix.image }}
          podman image ls --filter 'reference=${{ matrix.image }}'
          NEW_TAG="$(podman image ls --filter 'reference=${{ matrix.image }}' --format '{{ .Tag }}')"
          ALIAS_TAGS=("$NEW_TAG" "${NEW_TAG%%-*}")
          printf 'src=%s\naliases=%s\n' "$NEW_TAG" "${ALIAS_TAGS[*]}" | tee "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 #v4.5.1
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push to ghcr.io
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        id: push
        env:
          TAGS: ${{ steps.build.outputs.aliases }}
        run: |
          set -euxo pipefail

          SRC_IMAGE="${{ matrix.image }}:${{ steps.build.outputs.src }}"
          DEST_REPO="${{ env.IMAGE_REGISTRY }}/${{ matrix.image}}"

          # Perform an initial push to GHCR to work around
          # github.com/podman-container-tools/container-libs/issues/1129
          podman push "$SRC_IMAGE" "${DEST_REPO}:$(printf '%s\n' "$TAGS" | awk '{print $1}')"

          for TAG in $TAGS; do
            podman push --digestfile=/tmp/digestfile "$SRC_IMAGE" "${DEST_REPO}:${TAG}"
          done

          digest="$(cat /tmp/digestfile)"

          echo "digest=${digest}" | tee -a "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Sign container image
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false \
            --use-signing-config=false ${{ env.IMAGE_REGISTRY }}/${{ matrix.image }}@${DIGEST}

  check:
    name: Check all images built successfully
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    needs: [build-image]
    steps:
      - name: Fail build
        if: ${{ needs.build-image.result == 'failure' }}
        shell: bash
        run: exit 1
      - name: Exit normally
        shell: bash
        run: exit 0
